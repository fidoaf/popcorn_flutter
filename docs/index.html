<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/popcorn_flutter/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="A new Flutter project.">
  <meta name="theme-color" content="#1A1A2E">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="popcorn_flutter">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Popcorn</title>
  <link rel="manifest" href="manifest.json">

  <!-- Boot splash shown until Flutter renders its first frame. -->
  <style>
    #boot-splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      background: #1A1A2E;
      color: #FFFFFF;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      transition: opacity 0.4s ease;
    }
    #boot-splash.loaded {
      opacity: 0;
      pointer-events: none;
    }
    #boot-splash .gif {
      width: 320px;
      height: 320px;
      max-width: 70vw;
      max-height: 70vw;
      object-fit: cover;
      border-radius: 24px;
    }
    #boot-splash .title { font-size: 24px; font-weight: 700; letter-spacing: 0.5px; }
    #boot-splash .subtitle { font-size: 14px; color: #B0B0B0; }
  </style>
  <script>
    // Remove the boot splash once Flutter paints its first frame.
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('boot-splash');
      if (!splash) return;
      splash.classList.add('loaded');
      setTimeout(function () { splash.remove(); }, 400);
    });
  </script>

  <!-- Self-heal stale caches: unregister any old service worker and clear its caches. -->
  <script>
    (function () {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          regs.forEach(function (reg) { reg.unregister(); });
        });
      }
      if (window.caches && caches.keys) {
        caches.keys().then(function (keys) {
          keys.forEach(function (key) { caches.delete(key); });
        });
      }
    })();
  </script>
</head>
<body>
  <!-- Instant splash; replaced by the Flutter app on first frame. -->
  <div id="boot-splash">
    <img class="gif" src="assets/assets/gifs/popcorn_splash.gif" alt="Popcorn" />
    <div class="title">Popcorn</div>
    <div class="subtitle">Filling up your bucket...</div>
  </div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <!-- Resilient boot: GitHub Pages sometimes returns 503 for this entry script; retry with backoff. -->
  <script>
    (function () {
      var maxAttempts = 5;
      function loadBootstrap(attempt) {
        var s = document.createElement('script');
        s.src = 'flutter_bootstrap.js';
        s.async = true;
        s.onerror = function () {
          s.remove();
          if (attempt < maxAttempts) {
            setTimeout(function () { loadBootstrap(attempt + 1); }, Math.min(1000 * Math.pow(2, attempt), 8000));
          }
        };
        document.body.appendChild(s);
      }
      loadBootstrap(1);
    })();
  </script>
</body>
</html>
