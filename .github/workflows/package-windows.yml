name: Package Windows app

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  package-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: stable
          cache: true
      - name: Write env file
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path assets/config | Out-Null
          Set-Content -Path assets/config/app.env -Value $env:ENV_FILE -NoNewline
      - name: Install dependencies
        run: flutter pub get
      - name: Prepare App Installer output
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path build/publish | Out-Null
      - name: Publish App Installer
        run: dart run msix:publish
      - name: Stage App Installer files
        shell: pwsh
        env:
          GITHUB_REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: |
          $publishPath = (Resolve-Path build/publish).Path
          $appInstaller = Get-ChildItem $publishPath -Filter *.appinstaller | Select-Object -First 1
          [xml]$manifest = Get-Content $appInstaller.FullName
          $baseUrl = "https://$env:GITHUB_REPOSITORY_OWNER.github.io/$env:GITHUB_REPOSITORY_NAME/downloads"
          $manifest.DocumentElement.SetAttribute('Uri', "$baseUrl/$($appInstaller.Name)")
          $mainPackage = $manifest.SelectSingleNode("//*[local-name()='MainPackage']")
          $mainPackage.SetAttribute('Uri', "$baseUrl/versions/$([IO.Path]::GetFileName($mainPackage.Uri))")
          $manifest.Save($appInstaller.FullName)
          New-Item -ItemType Directory -Force -Path msix | Out-Null
          Copy-Item "$publishPath\*" msix -Recurse -Force
          Copy-Item "$publishPath\versions\*.msix" msix/popcorn_flutter.msix -Force

          $certPfx = Get-ChildItem "$env:LOCALAPPDATA\Pub\Cache\hosted\pub.dev\msix-*\lib\assets\test_certificate.pfx" | Select-Object -First 1
          $cert = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2($certPfx.FullName, '1234')
          Export-Certificate -Cert $cert -FilePath msix/popcorn_flutter.cer | Out-Null

          $indexHtml = Join-Path 'msix' 'index.html'
          $trustNote = '<div style="background:#fef3c7;border:1px solid #f59e0b;padding:12px 16px;margin:14px;border-radius:6px;font-family:sans-serif"><strong>First-time install?</strong> This app is signed with a development certificate. <a href="popcorn_flutter.cer" style="color:#0369a1">Download and install the certificate</a> (double-click it, choose "Local Machine", then "Place all certificates in the following store" &rarr; "Trusted People") before clicking Install.</div>'
          $indexContent = (Get-Content $indexHtml -Raw) -replace '(<body>)', "`$1`n$trustNote"
          $indexContent = $indexContent -replace "a\.href = '/", "a.href = './"
          Set-Content $indexHtml -Value $indexContent
      - name: Upload App Installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: popcorn-windows-app-installer
          path: msix

  deploy-pages:
    needs: package-windows
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Write env file (production)
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          mkdir -p docs/assets/assets/config
          printf '%s\n' "$ENV_FILE" > docs/assets/assets/config/app.env
      - name: Write env file (test)
        if: hashFiles('docs/test/**') != ''
        env:
          TEST_ENV_FILE: ${{ secrets.TEST_ENV_FILE }}
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          mkdir -p docs/test/assets/assets/config
          if [ -n "$TEST_ENV_FILE" ]; then
            printf '%s\n' "$TEST_ENV_FILE" > docs/test/assets/assets/config/app.env
          else
            printf '%s\n' "$ENV_FILE" > docs/test/assets/assets/config/app.env
          fi
      - name: Write env file (admin)
        if: hashFiles('docs/admin/**') != ''
        env:
          ADMIN_ENV_FILE: ${{ secrets.ADMIN_ENV_FILE }}
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          mkdir -p docs/admin/assets/assets/config
          if [ -n "$ADMIN_ENV_FILE" ]; then
            printf '%s\n' "$ADMIN_ENV_FILE" > docs/admin/assets/assets/config/app.env
          else
            printf '%s\n' "$ENV_FILE" > docs/admin/assets/assets/config/app.env
          fi
      - name: Download App Installer files
        uses: actions/download-artifact@v8
        with:
          name: popcorn-windows-app-installer
          path: docs/downloads
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
