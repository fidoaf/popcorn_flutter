name: Package Windows app (Inno Setup)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-inno
  cancel-in-progress: false

jobs:
  package-inno:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Write env file
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:ENV_FILE)) {
            throw 'ENV_FILE must contain the complete app environment configuration.'
          }
          New-Item -ItemType Directory -Force -Path assets/config | Out-Null
          Set-Content -Path assets/config/app.env -Value $env:ENV_FILE -NoNewline
      - name: Install dependencies
        run: flutter pub get
      - name: Ensure Inno Setup compiler
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $compiler)) {
            choco install innosetup --version=6.7.3 --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Installing Inno Setup failed.' }
          }
          if (!(Test-Path $compiler)) { throw 'Inno Setup compiler not found.' }
          "INNO_COMPILER=$compiler" >> $env:GITHUB_ENV
      - name: Build per-user installer
        shell: pwsh
        run: .\tool\build_windows_installer.ps1 -CompilerPath $env:INNO_COMPILER
      - name: Stage stable download and checksum
        shell: pwsh
        run: |
          $version = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9]+\.[0-9]+\.[0-9]+)').Matches[0].Groups[1].Value
          $installers = @(Get-ChildItem build\installer\Popcorn-*-Windows-x64-Setup.exe)
          if ($installers.Count -ne 1) { throw 'Expected exactly one Inno installer.' }
          if ($installers[0].Name -ne "Popcorn-$version-Windows-x64-Setup.exe") { throw 'Installer filename does not match pubspec.yaml version.' }
          Copy-Item $installers[0].FullName build\installer\Popcorn-Windows-x64-Setup.exe
          $hash = (Get-FileHash $installers[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($installers[0].Name)" | Set-Content build\installer\SHA256SUMS.txt -Encoding ascii
      - name: Upload Inno installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: popcorn-windows-inno-installer
          path: |
            build/installer/*-Setup.exe
            build/installer/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
      - name: Publish versioned Windows Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: pwsh
        run: |
          $version = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9]+\.[0-9]+\.[0-9]+)').Matches[0].Groups[1].Value
          .\tool\publish_windows_release.ps1 -AssetPaths @(
            "build\installer\Popcorn-$version-Windows-x64-Setup.exe",
            'build\installer\SHA256SUMS.txt'
          )
          "### Windows per-user installer" >> $env:GITHUB_STEP_SUMMARY
          "- [Download installer](https://github.com/$env:GH_REPO/releases/download/v$version/Popcorn-$version-Windows-x64-Setup.exe)" >> $env:GITHUB_STEP_SUMMARY
          "- [Checksums](https://github.com/$env:GH_REPO/releases/download/v$version/SHA256SUMS.txt)" >> $env:GITHUB_STEP_SUMMARY
          "- Built from commit: $env:GITHUB_SHA" >> $env:GITHUB_STEP_SUMMARY
