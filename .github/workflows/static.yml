# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Write env file (production)
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          mkdir -p docs/assets/assets/config
          printf '%s\n' "$ENV_FILE" > docs/assets/assets/config/app.env
      # Test build lives in docs/test/ (built locally with --base-href /popcorn_flutter/test/).
      # Falls back to the production ENV_FILE secret when TEST_ENV_FILE is not set.
      - name: Write env file (test)
        if: hashFiles('docs/test/**') != ''
        env:
          TEST_ENV_FILE: ${{ secrets.TEST_ENV_FILE }}
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          mkdir -p docs/test/assets/assets/config
          if [ -n "$TEST_ENV_FILE" ]; then
            printf '%s\n' "$TEST_ENV_FILE" > docs/test/assets/assets/config/app.env
          else
            printf '%s\n' "$ENV_FILE" > docs/test/assets/assets/config/app.env
          fi
      # Admin build lives in docs/admin/ (built locally with --base-href /popcorn_flutter/admin/).
      # Falls back to the production ENV_FILE secret when ADMIN_ENV_FILE is not set.
      - name: Write env file (admin)
        if: hashFiles('docs/admin/**') != ''
        env:
          ADMIN_ENV_FILE: ${{ secrets.ADMIN_ENV_FILE }}
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          mkdir -p docs/admin/assets/assets/config
          if [ -n "$ADMIN_ENV_FILE" ]; then
            printf '%s\n' "$ADMIN_ENV_FILE" > docs/admin/assets/assets/config/app.env
          else
            printf '%s\n' "$ENV_FILE" > docs/admin/assets/assets/config/app.env
          fi
      - name: Preserve published Windows installer
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          mkdir -p docs/downloads/versions
          repository_name="${REPOSITORY#*/}"
          base_url="https://${GITHUB_REPOSITORY_OWNER}.github.io/${repository_name}/downloads"
          appinstaller="docs/downloads/popcorn_flutter.appinstaller"
          if curl --fail --silent --show-error "$base_url/popcorn_flutter.appinstaller" --output "$appinstaller"; then
            curl --fail --silent --show-error "$base_url/index.html" --output docs/downloads/index.html
            curl --fail --silent --show-error "$base_url/popcorn_flutter.cer" --output docs/downloads/popcorn_flutter.cer
            package_url="$(python3 -c 'import sys, xml.etree.ElementTree as ET; root = ET.parse(sys.argv[1]).getroot(); print(next(node.attrib["Uri"] for node in root.iter() if node.tag.endswith("MainPackage")))' "$appinstaller")"
            package_name="${package_url##*/}"
            curl --fail --silent --show-error "$package_url" --output "docs/downloads/versions/$package_name"
            cp "docs/downloads/versions/$package_name" docs/downloads/popcorn_flutter.msix
          fi
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload the built Flutter web app
          path: './docs'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
